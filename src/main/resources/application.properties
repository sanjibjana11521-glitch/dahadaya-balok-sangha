spring.application.name=balok-sangha-website

# Render provides PORT automatically. Keep 8080 as the local fallback.
server.port=${PORT:8080}

# PostgreSQL
# On Render, set DB_URL to the JDBC form of your PostgreSQL Internal Database URL:
# jdbc:postgresql://<host>/<database>
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/balok_sangha}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.hbm2ddl.auto=update

spring.thymeleaf.cache=false

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
